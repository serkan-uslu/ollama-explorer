name: 📊 Wrong Model Data
description: A model's source-backed catalog or variant data is incorrect or outdated.
labels: ['data']
body:
  - type: markdown
    attributes:
      value: |
        Catalog fields are parsed from Ollama. Share the source page so the parser or checked-in data can be corrected.

  - type: input
    id: model
    attributes:
      label: Model name
      placeholder: 'e.g. llama3.1'
    validations:
      required: true

  - type: input
    id: model_url
    attributes:
      label: Model page URL
      placeholder: 'e.g. https://ollama-explorer.vercel.app/models/llama3.1'
    validations:
      required: false

  - type: dropdown
    id: field
    attributes:
      label: Which field is wrong?
      options:
        - Availability
        - Capabilities
        - Applications
        - Download size
        - Estimated memory
        - Context window
        - Input modalities
        - Quantization
        - Variant or tag
        - Model family
        - License
        - Description
        - Parameter sizes
        - Source update date
        - Other
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current (wrong) value
      placeholder: 'What does the site currently show?'
    validations:
      required: true

  - type: textarea
    id: correct
    attributes:
      label: Correct value
      placeholder: 'What should it show instead?'
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source
      description: Link to the official Ollama page or documentation that confirms the correct value.
      placeholder: 'https://ollama.com/library/...'
    validations:
      required: true
