name: Update model catalog

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Refetch every model detail and tag page
        required: false
        default: false
        type: boolean
  schedule:
    # Every day at 06:17 Europe/Istanbul (03:17 UTC). The off-hour minute avoids
    # GitHub Actions' busiest scheduling boundary.
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: update-model-catalog
  cancel-in-progress: false

jobs:
  update:
    if: vars.OLLAMA_CRAWL_AUTHORIZED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Capture base revision
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/miner/requirements.lock

      - name: Install miner
        run: |
          python -m pip install --require-hashes -r tools/miner/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e tools/miner

      - name: Verify miner
        run: |
          ruff check tools/miner
          pytest tools/miner/tests

      - name: Build catalog
        env:
          OLLAMA_CRAWL_AUTHORIZED: 'true'
          OLLAMA_MINER_TOKEN: ${{ secrets.OLLAMA_MINER_TOKEN }}
        run: |
          set -euo pipefail
          args=(
            --repo-root .
            --summary-file "$RUNNER_TEMP/catalog-summary.md"
            --fail-on-partial
          )
          if [ "${{ inputs.force_refresh || 'false' }}" = "true" ]; then
            args+=(--force-refresh)
            echo "- Refresh mode: **manual full refresh**" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%u)" = "7" ]; then
            args+=(--force-refresh)
            echo "- Refresh mode: **weekly full refresh**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Refresh mode: **incremental**" >> "$GITHUB_STEP_SUMMARY"
          fi
          python -m ollama_miner "${args[@]}"

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- public/data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "- Result: **no catalog changes**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "- Result: **catalog changes detected; validating the production build**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Verify web app with candidate catalog
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm test
          npm run lint
          npm run build
          npm run check:bundle

      - name: Publish catalog to the production branch
        if: steps.changes.outputs.changed == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_BRANCH"
          remote_sha="$(git rev-parse "origin/$BASE_BRANCH")"
          if [ "$remote_sha" != "$BASE_SHA" ]; then
            echo "::error::The production branch advanced during this run; refusing to overwrite it."
            echo "- Publish: **stopped because the production branch changed during validation**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Vercel associates private-repository deployments with the commit
          # author, so use the verified repository-owner identity.
          git config user.name "Serkan Uslu"
          git config user.email "65805346+serkan-uslu@users.noreply.github.com"
          git add public/data
          # The candidate has already passed every validation above. Skip local
          # Husky hooks so lint-staged cannot reformat deterministic JSON after
          # the production build, and keep the repository's valid data scope.
          git commit --no-verify -m "chore(data): refresh Ollama models"
          git push origin "HEAD:$BASE_BRANCH"
          echo "- Publish: **committed to \`$BASE_BRANCH\`; Vercel production deployment requested by Git integration**" >> "$GITHUB_STEP_SUMMARY"
