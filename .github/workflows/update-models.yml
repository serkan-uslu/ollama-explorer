name: Update model catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-model-catalog
  cancel-in-progress: false

jobs:
  update:
    if: >-
      vars.OLLAMA_CRAWL_AUTHORIZED == 'true' &&
      (github.event_name == 'workflow_dispatch' || vars.OLLAMA_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/miner/pyproject.toml

      - name: Install miner
        run: python -m pip install -e 'tools/miner[dev]'

      - name: Verify miner
        run: |
          ruff check tools/miner
          pytest tools/miner/tests

      - name: Build catalog
        env:
          OLLAMA_CRAWL_AUTHORIZED: 'true'
          OLLAMA_MINER_TOKEN: ${{ secrets.OLLAMA_MINER_TOKEN }}
        run: >-
          python -m ollama_miner
          --repo-root .
          --summary-file "$RUNNER_TEMP/catalog-summary.md"

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- public/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "- Result: **no catalog changes**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/catalog-update"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add public/data
          git commit -m "chore(catalog): refresh Ollama models"
          git push --force-with-lease --set-upstream origin "$branch"
          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --title "chore(catalog): refresh Ollama models" \
              --body-file "$RUNNER_TEMP/catalog-summary.md"
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$branch" \
              --title "chore(catalog): refresh Ollama models" \
              --body-file "$RUNNER_TEMP/catalog-summary.md"
          fi
