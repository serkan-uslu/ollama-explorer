name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run check:bundle

  verify-miner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/miner/requirements.lock
      - run: |
          python -m pip install --require-hashes -r tools/miner/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e tools/miner
      - run: ruff check tools/miner
      - run: pytest tools/miner/tests
